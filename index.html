<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #a3b494;
    --sage-deep: #3f5238;
    --sage-light: #c9d6bd;
    --paper: #fbfaf4;
    --shadow: 0 2px 3px rgba(40,55,35,.18), 0 10px 22px rgba(40,55,35,.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--sage); color: var(--sage-deep); font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  #board { position: relative; min-height: 100vh; overflow: hidden; }

  #q { width: 100%; padding: 14px 22px; font: 500 18px inherit; font-family: inherit; color: var(--sage-deep); background: var(--paper); border: 2px solid transparent; border-radius: 999px; outline: none; box-shadow: var(--shadow); }
  #q:focus-visible { border-color: var(--sage-deep); }
  #q::placeholder { color: #7d8c73; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .tools button { font: 500 14px inherit; font-family: inherit; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--sage-deep); background: transparent; color: var(--sage-deep); cursor: pointer; }
  .tools button:hover { background: var(--sage-deep); color: var(--sage); }
  .tools button:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 2px; }

  .widget { position: absolute; min-width: 120px; min-height: 80px; border-radius: 6px; box-shadow: var(--shadow); resize: both; overflow: hidden; touch-action: none; cursor: grab; display: flex; flex-direction: column; }
  .widget.dragging { cursor: grabbing; box-shadow: 0 16px 34px rgba(40,55,35,.28); }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; min-height: 28px; opacity: 0; transition: opacity .15s; }
  .widget:hover .bar, .widget:focus-within .bar { opacity: 1; }
  .bar button { border: 0; background: none; cursor: pointer; color: inherit; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
  .bar button:hover { background: rgba(0,0,0,.1); }
  .dots { display: flex; gap: 5px; }
  .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.25); }

  .note { background: #f7e48b; color: #3a3320; }
  .note textarea { flex: 1; width: 100%; border: 0; background: transparent; resize: none; outline: none; padding: 0 14px 12px; font: 600 22px/1.25 "Caveat", "Comic Sans MS", cursive; color: inherit; cursor: text; }
  .note textarea::placeholder { color: rgba(58,51,32,.45); }

  .clock { background: var(--paper); text-align: center; }
  .clock .face { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 14px 14px; cursor: pointer; }
  .clock .time { font-weight: 700; font-size: 44px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .clock .date { margin-top: 8px; font-size: 14px; color: #6b7a61; }

  .image { background: var(--paper); }
  .image img { flex: 1; min-height: 0; width: 100%; object-fit: cover; display: block; pointer-events: none; }
  .image .bar { position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(rgba(0,0,0,.45), transparent); color: #fff; }
  .image .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 12px; font-size: 14px; }
  .image .empty button, .image .empty input { font: inherit; font-family: inherit; padding: 7px 10px; border-radius: 6px; border: 1.5px solid var(--sage-deep); background: transparent; color: var(--sage-deep); }
  .image .empty button { cursor: pointer; }
  .image .empty button:hover { background: var(--sage-deep); color: var(--paper); }
  .image .empty input { background: #fff; }
  .image.cutout { background: transparent; box-shadow: none; }
  .image.cutout img { flex: 1; width: calc(100% - 20px); margin: 10px; object-fit: contain;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 5px 7px rgba(40,55,35,.35)); }
  .image.cutout .bar { top: 4px; left: 4px; right: 4px; border-radius: 6px; background: rgba(251,250,244,.92); color: var(--sage-deep); }
  .image .cut { font-size: 12px; font-family: inherit; }
  body { background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; }
  .pin { position: absolute; z-index: 5000; display: flex; align-items: center; gap: 4px; }
  .pin.dragging { opacity: .85; }
  .grip { cursor: grab; touch-action: none; user-select: none; opacity: .55; padding: 6px 4px; font-size: 18px; line-height: 1; }
  .grip:hover { opacity: 1; }
  #searchPin { left: 50%; top: 40px; transform: translateX(-50%); width: min(670px, 94vw); }
  #searchPin form { flex: 1; }
  #toolsPin { left: 50%; top: 100px; transform: translateX(-50%); }
  #gear { top: 16px; right: 16px; display: block; }
  #gearBtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper); color: var(--sage-deep); box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center; touch-action: none; }
  #gearBtn:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 2px; }
  #panel { position: absolute; top: calc(100% + 8px); right: 0; width: 230px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); border-radius: 10px; box-shadow: var(--shadow); }
  #panel[hidden] { display: none; }
  #panel.left { right: auto; left: 0; }
  #panel.up { top: auto; bottom: calc(100% + 8px); }
  #panel button { font: 500 14px inherit; font-family: inherit; text-align: left; padding: 8px 12px; border-radius: 6px; border: 1.5px solid var(--sage-deep); background: transparent; color: var(--sage-deep); cursor: pointer; }
  #panel button:hover { background: var(--sage-deep); color: var(--paper); }
  #msg { position: fixed; z-index: 6000; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: var(--sage-deep); color: var(--paper); font-size: 14px; pointer-events: none; }
  #msg:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="board">
  <div class="pin" id="searchPin">
    <span class="grip" title="Drag to move">&#10303;</span>
    <form action="https://www.google.com/search" method="get">
      <input id="q" type="text" name="q" placeholder="Search Google" autocomplete="off" autofocus aria-label="Search Google">
    </form>
  </div>
  <div class="pin" id="toolsPin">
    <span class="grip" title="Drag to move">&#10303;</span>
    <div class="tools">
      <button data-add="note">+ Note</button>
      <button data-add="image">+ Image</button>
      <button data-add="clock">+ Clock</button>
    </div>
  </div>
  <div class="pin" id="gear">
    <button id="gearBtn" aria-label="Settings" aria-expanded="false" aria-controls="panel" title="Settings (drag to move)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div id="panel" role="dialog" aria-label="Settings" hidden>
      <button id="exportBtn">Download settings</button>
      <button id="importBtn">Upload settings</button>
      <button id="bgBtn">Upload background image</button>
      <button id="bgClear">Remove background image</button>
    </div>
  </div>
  <div id="msg" role="status"></div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="bgFile" accept="image/*" hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
const KEY = 'newtab.widgets.v1';
const COLORS = ['#f7e48b', '#f4b6c2', '#bfe3d0', '#fbfaf4'];
const board = document.getElementById('board');
const msgEl = document.getElementById('msg');
const fileInput = document.getElementById('file');
const uid = () => Math.random().toString(36).slice(2, 10);
let topZ = 1;

function load() {
  try { const w = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(w)) return w; } catch (e) {}
  return [{ id: uid(), type: 'clock', x: 40, y: 150, w: 270, h: 130, z: 1, h24: false }];
}
let widgets = load();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(widgets)); msgEl.textContent = ''; }
  catch (e) { msgEl.textContent = 'Storage is full. Remove an image or use a smaller one.'; }
}

const defaults = {
  note:  { w: 220, h: 200, text: '', color: COLORS[0] },
  image: { w: 280, h: 220, src: '' },
  clock: { w: 270, h: 130, h24: false }
};

function addWidget(type) {
  const n = widgets.length;
  widgets.push({ id: uid(), type, x: 40 + (n % 6) * 28, y: 150 + (n % 6) * 28, z: ++topZ, ...defaults[type] });
  save(); render();
}

function removeWidget(id) { widgets = widgets.filter(w => w.id !== id); save(); render(); }

function bar(w, extra) {
  const b = document.createElement('div');
  b.className = 'bar';
  b.append(extra || document.createElement('span'));
  const x = document.createElement('button');
  x.textContent = '×'; x.title = 'Remove'; x.setAttribute('aria-label', 'Remove widget');
  x.onclick = () => removeWidget(w.id);
  b.append(x);
  return b;
}

function buildNote(w, el) {
  const dots = document.createElement('div'); dots.className = 'dots';
  COLORS.forEach(c => {
    const d = document.createElement('button');
    d.style.background = c; d.setAttribute('aria-label', 'Note color ' + c);
    d.onclick = () => { w.color = c; el.style.background = c; save(); };
    dots.append(d);
  });
  const ta = document.createElement('textarea');
  ta.placeholder = 'Write something…'; ta.value = w.text || '';
  ta.oninput = () => { w.text = ta.value; save(); };
  el.style.background = w.color;
  el.append(bar(w, dots), ta);
}

function buildClock(w, el) {
  const face = document.createElement('div'); face.className = 'face';
  face.title = 'Click to switch 12/24 hour';
  const t = document.createElement('div'); t.className = 'time';
  const d = document.createElement('div'); d.className = 'date';
  face.append(t, d);
  face.onclick = () => { w.h24 = !w.h24; save(); tick(); };
  const tick = () => {
    const now = new Date();
    t.textContent = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: !w.h24 });
    d.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  };
  tick();
  el._tick = tick;
  el.append(bar(w), face);
}

function buildImage(w, el) {
  el.classList.toggle('cutout', !!(w.src && w.cutout));
  if (w.src) {
    const tg = document.createElement('button');
    tg.className = 'cut'; tg.textContent = w.cutout ? 'Cutout: on' : 'Cutout: off';
    tg.title = 'Outline the visible part of a transparent image';
    tg.onclick = () => { w.cutout = !w.cutout; save(); render(); };
    el.append(bar(w, tg));
  } else el.append(bar(w));
  if (w.src) {
    const img = document.createElement('img'); img.src = w.src; img.alt = '';
    img.onerror = () => { msgEl.textContent = 'That image could not be loaded.'; };
    el.append(img);
    return;
  }
  const box = document.createElement('div'); box.className = 'empty';
  const up = document.createElement('button'); up.textContent = 'Upload an image';
  up.onclick = () => { fileInput.onchange = () => handleFile(w); fileInput.click(); };
  const url = document.createElement('input'); url.placeholder = 'or paste an image URL, press Enter';
  url.onkeydown = e => { if (e.key === 'Enter' && url.value.trim()) { w.src = url.value.trim(); save(); render(); } };
  box.append(up, url);
  el.append(box);
}

function handleFile(w) {
  const f = fileInput.files[0]; fileInput.value = '';
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 800, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      let alpha = false;
      try {
        const d = ctx.getImageData(0, 0, c.width, c.height).data;
        for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { alpha = true; break; }
      } catch (e) {}
      w.cutout = alpha;
      w.src = alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.82);
      save(); render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}

function makeDraggable(w, el) {
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('textarea, button, input')) return;
    const r = el.getBoundingClientRect();
    if (e.clientX > r.right - 20 && e.clientY > r.bottom - 20) return; // resize corner
    w.z = ++topZ; el.style.zIndex = w.z;
    const ox = e.clientX - w.x, oy = e.clientY - w.y;
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
    const move = ev => {
      w.x = Math.max(0, ev.clientX - ox); w.y = Math.max(0, ev.clientY - oy);
      el.style.left = w.x + 'px'; el.style.top = w.y + 'px';
    };
    const up = () => { el.classList.remove('dragging'); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); save(); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
  });
}

let resizeTimer;
const ro = new ResizeObserver(entries => {
  let changed = false;
  for (const en of entries) {
    const w = widgets.find(x => x.id === en.target.dataset.id);
    if (!w) continue;
    const nw = Math.round(en.target.offsetWidth), nh = Math.round(en.target.offsetHeight);
    if (Math.abs(nw - w.w) > 1 || Math.abs(nh - w.h) > 1) { w.w = nw; w.h = nh; changed = true; }
  }
  if (changed) { clearTimeout(resizeTimer); resizeTimer = setTimeout(save, 300); }
});

function render() {
  ro.disconnect();
  board.querySelectorAll('.widget').forEach(n => n.remove());
  widgets.forEach(w => {
    topZ = Math.max(topZ, w.z || 1);
    const el = document.createElement('section');
    el.className = 'widget ' + w.type; el.dataset.id = w.id;
    Object.assign(el.style, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px', zIndex: w.z || 1 });
    ({ note: buildNote, clock: buildClock, image: buildImage })[w.type](w, el);
    makeDraggable(w, el);
    board.append(el);
    ro.observe(el);
  });
}

const PKEY = 'newtab.pins.v1', BKEY = 'newtab.bg.v1';
const SAFE = /^(data:image\/[a-z0-9.+-]+;base64,[A-Za-z0-9+\/=]+|https?:\/\/[^\s"'()\\]+)$/i;
const PINS = { search: 'searchPin', tools: 'toolsPin', gear: 'gear' };
const gear = document.getElementById('gear'), gearBtn = document.getElementById('gearBtn'), panel = document.getElementById('panel');
let pins = {}, bg = '', toastTimer;
try { pins = JSON.parse(localStorage.getItem(PKEY)) || {}; bg = localStorage.getItem(BKEY) || ''; } catch (e) {}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function toast(t) { msgEl.textContent = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => msgEl.textContent = '', 3500); }
function savePins() { try { localStorage.setItem(PKEY, JSON.stringify(pins)); } catch (e) {} }
function saveBg() { try { bg ? localStorage.setItem(BKEY, bg) : localStorage.removeItem(BKEY); } catch (e) { toast('Storage is full. Try a smaller background image.'); } }
function applyBg() { document.body.style.backgroundImage = bg && SAFE.test(bg) ? 'url("' + bg + '")' : ''; }
function applyPins() {
  for (const k in PINS) {
    const p = pins[k], el = document.getElementById(PINS[k]);
    if (!p) continue;
    el.style.left = clamp(p.x, 0, innerWidth - 60) + 'px'; el.style.top = clamp(p.y, 0, innerHeight - 50) + 'px';
    el.style.right = 'auto'; el.style.transform = 'none';
  }
}

function pinDrag(el, key, handle) {
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const r = el.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top, sx = e.clientX, sy = e.clientY;
    let moved = false;
    handle.setPointerCapture(e.pointerId);
    const move = ev => {
      if (!moved) { if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return; moved = true; el.classList.add('dragging'); el.style.right = 'auto'; el.style.transform = 'none'; }
      const x = clamp(ev.clientX - ox, 0, innerWidth - 60), y = clamp(ev.clientY - oy, 0, innerHeight - 50);
      el.style.left = x + 'px'; el.style.top = y + 'px'; pins[key] = { x, y };
    };
    const up = () => {
      handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up);
      el.classList.remove('dragging');
      if (moved) { savePins(); el._moved = true; setTimeout(() => el._moved = false, 0); }
    };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up);
  });
}
pinDrag(document.getElementById('searchPin'), 'search', document.querySelector('#searchPin .grip'));
pinDrag(document.getElementById('toolsPin'), 'tools', document.querySelector('#toolsPin .grip'));
pinDrag(gear, 'gear', gearBtn);

function setPanel(open) {
  panel.hidden = !open; gearBtn.setAttribute('aria-expanded', open);
  if (open) { const r = gear.getBoundingClientRect(); panel.classList.toggle('left', r.left < 260); panel.classList.toggle('up', r.bottom + 230 > innerHeight); }
}
gearBtn.onclick = () => { if (gear._moved) return; setPanel(panel.hidden); };
document.addEventListener('pointerdown', e => { if (!gear.contains(e.target)) setPanel(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setPanel(false); });
window.addEventListener('resize', applyPins);

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify({ app: 'newtab', version: 1, widgets, pins, bg })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'newtab-settings.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
const importFile = document.getElementById('importFile'), bgFile = document.getElementById('bgFile');
document.getElementById('importBtn').onclick = () => importFile.click();
document.getElementById('bgBtn').onclick = () => bgFile.click();
document.getElementById('bgClear').onclick = () => { bg = ''; saveBg(); applyBg(); };

importFile.onchange = () => {
  const f = importFile.files[0]; importFile.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || d.app !== 'newtab' || !Array.isArray(d.widgets)) throw new Error('bad file');
      const num = (v, a, b, def) => Number.isFinite(v) ? clamp(v, a, b, def) : def;
      widgets = d.widgets.filter(w => w && ['note', 'image', 'clock'].includes(w.type)).slice(0, 100).map(w => ({
        id: uid(), type: w.type, x: num(w.x, 0, 5000, 40), y: num(w.y, 0, 5000, 150), w: num(w.w, 120, 2000, 220), h: num(w.h, 80, 2000, 200), z: num(w.z, 1, 1e6, 1),
        text: typeof w.text === 'string' ? w.text.slice(0, 5000) : '', color: COLORS.includes(w.color) ? w.color : COLORS[0],
        h24: !!w.h24, cutout: !!w.cutout, src: typeof w.src === 'string' && SAFE.test(w.src) ? w.src : ''
      }));
      pins = {};
      for (const k in PINS) { const p = d.pins && d.pins[k]; if (p && Number.isFinite(p.x) && Number.isFinite(p.y)) pins[k] = { x: p.x, y: p.y }; }
      bg = typeof d.bg === 'string' && SAFE.test(d.bg) ? d.bg : '';
      save(); savePins(); saveBg(); applyBg(); applyPins(); render(); toast('Settings loaded.');
    } catch (e) { toast('That is not a valid settings file.'); }
  };
  rd.readAsText(f);
};

bgFile.onchange = () => {
  const f = bgFile.files[0]; bgFile.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1920 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      bg = c.toDataURL('image/jpeg', 0.8); saveBg(); applyBg();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
};

applyBg(); applyPins();
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addWidget(b.dataset.add));
setInterval(() => board.querySelectorAll('.clock').forEach(c => c._tick && c._tick()), 1000);
render();
</script>
</body>
</html>

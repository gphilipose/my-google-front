<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #fff; }
    input { width: min(600px, 90vw); padding: 14px 20px; font-size: 18px; border: 1px solid #ccc; border-radius: 999px; outline: none; }
    input:focus { box-shadow: 0 1px 6px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <form action="https://www.google.com/search" method="get">
    <input type="text" name="q" placeholder="Search Google" autofocus autocomplete="off">
  </form>
</body>
</html>
